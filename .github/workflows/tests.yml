name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m grippy_control --config config.example.json --check-config
      - run: python -m compileall -q grippy_control scripts
      - run: bash -n scripts/install-pi.sh scripts/connect.sh
      - run: bash scripts/install-pi.sh --dry-run
      - run: python -m pip install .
      - run: grippy-control --help
