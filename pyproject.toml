[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grippybot-control"
version = "0.1.0"
description = "Local Raspberry Pi servo controller with a draggable browser panel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Smart Wojtech Lab"}]

[project.optional-dependencies]
pi = ["pigpio>=1.78,<2"]

[project.scripts]
grippy-control = "grippy_control.server:main"

[tool.setuptools.packages.find]
include = ["grippy_control*"]

[tool.setuptools.package-data]
grippy_control = ["panel.html"]
