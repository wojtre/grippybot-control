  <text x="550" y="180.0" font-size="13" font-weight="700" fill="#e1e9e8">GND</text>
  <text x="660" y="180.0" font-size="14" font-weight="700" fill="#e1e9e8">→ szyna „−” płytki (wspólna masa)</text>
