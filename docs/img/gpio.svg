<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Złącze GPIO Raspberry Pi 4: używane piny 6, 11, 13, 15, 16, 18</title>
  <rect width="980" height="760" rx="18" fill="#0f1a1c"/>
  <text x="30" y="40" fill="#e8f6f3" font-size="22" font-weight="700">Złącze GPIO Raspberry Pi 4 — których pinów używamy</text>
  <text x="30" y="64" fill="#8fb3ad" font-size="14">Widok z góry, złącze po prawej stronie płytki, porty USB i Ethernet na dole. Pin 1 ma kwadratowe pole.</text>
  <text x="30" y="84" fill="#8fb3ad" font-size="14">W konfiguracji podajemy numery BCM (np. GPIO17), a nie kolejne numery pinów.</text>
  <rect x="410" y="92" width="160" height="652" rx="14" fill="#1a2a2d" stroke="#3a5257" stroke-width="2"/>
  <rect x="450" y="102.0" width="20" height="20" rx="3" fill="#41575b"/>
  <text x="460" y="116.0" text-anchor="middle" font-size="10" font-weight="700" fill="#c9dcd8">1</text>
  <text x="430" y="117.0" text-anchor="end" font-size="13" font-weight="400" fill="#6f8a86">3V3</text>
  <circle cx="520" cy="112.0" r="10" fill="#c0392b"/>
  <text x="520" y="116.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0f1a1c">2</text>
  <text x="550" y="117.0" font-size="13" font-weight="700" fill="#ff8f87">5V</text>
  <text x="660" y="117.0" font-size="13" font-weight="700" fill="#ff8f87">→ nie podłączaj do serw</text>
  <circle cx="460" cy="143.5" r="10" fill="#41575b"/>
  <text x="460" y="147.5" text-anchor="middle" font-size="10" font-weight="700" fill="#c9dcd8">3</text>
  <text x="430" y="148.5" text-anchor="end" font-size="13" font-weight="400" fill="#6f8a86">GPIO2</text>
  <circle cx="520" cy="143.5" r="10" fill="#c0392b"/>
  <text x="520" y="147.5" text-anchor="middle" font-size="10" font-weight="700" fill="#0f1a1c">4</text>
  <text x="550" y="148.5" font-size="13" font-weight="700" fill="#ff8f87">5V</text>
  <text x="660" y="148.5" font-size="13" font-weight="700" fill="#ff8f87">→ nie podłączaj do serw</text>
  <circle cx="460" cy="175.0" r="10" fill="#41575b"/>
